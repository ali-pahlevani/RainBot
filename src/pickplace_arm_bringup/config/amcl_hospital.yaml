# AMCL localization against maps/aws_hospital.yaml.
#
# The tuning is carried over unchanged from the warehouse run; only the initial
# pose and the map differ. The map is generated from aws_hospital.sdf's own
# collision geometry rather than by SLAM, so a Gazebo coordinate is a map
# coordinate and the initial pose is simply the robot's spawn pose.
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan

    # = hospital_pickplace_layout.SPAWN, i.e. gazebo.launch.py's SPAWN_X /
    # SPAWN_Y / SPAWN_YAW. These three must move together.
    set_initial_pose: true
    initial_pose:
      x: -4.0
      y: 8.0
      z: 0.0
      yaw: 1.5707963

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # first_map_only: map_pump re-publishes /map during bring-up, and AMCL
    # re-seeds its particle filter on every map callback.
    # likelihood_field_prob + beam skipping: the map omits the racks and the
    # other robots, so beams returned off them are dropped rather than counted
    # as evidence against the correct pose.
    first_map_only: true
    laser_model_type: "likelihood_field_prob"
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    # 25.0, matching the LIDAR's own range in pickplace_arm.gazebo.xacro. AMCL
    # discards returns beyond this value.
    laser_max_range: 25.0
    laser_min_range: 0.15
    max_beams: 90
    min_particles: 750 #500
    max_particles: 2500 #2000

    # motion noise (diff drive)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2

    # likelihood field
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0

    update_min_a: 0.10
    update_min_d: 0.10
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    tf_broadcast: true
