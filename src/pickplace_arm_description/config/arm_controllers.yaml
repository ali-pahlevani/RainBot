# Node keys are wildcarded (`/**/name`) so one file serves both the single robot
# at /controller_manager and a namespaced one at /r1/controller_manager.
# Without it a namespaced controller_manager comes up with no parameters at all
# and every spawner dies with "Failed loading controller <name>".
/**/controller_manager:
  ros__parameters:
# 25 Hz drives every controller, and through joint_state_broadcaster it sets the
# /tf republish rate as well. Nav2's controller runs at 20 Hz, so this stays
# ahead of every consumer.
    update_rate: 25  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# Explicit joint list, only because of the mimic finger: gz_ros2_control registers
# a mimic joint's interfaces under "<joint_name>_mimic", so the default
# publish-everything mode emits `fr3_finger_joint2_mimic`, a name in no robot
# model. fr3_finger_joint2 itself is omitted because robot_state_publisher and
# MoveIt both derive it. `joints` and `interfaces` must both be set for the
# broadcaster to leave its all-available-interfaces mode.
/**/joint_state_broadcaster:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
      - fr3_finger_joint1
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    interfaces:
      - position
      - velocity

/**/arm_controller:
  ros__parameters:
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.5
/**/gripper_controller:
  ros__parameters:
# Only finger_joint1: fr3_finger_joint2 mimics it, so listing it here too would
# have the controller and the mimic both driving one joint.
    joints:
      - fr3_finger_joint1
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
/**/diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]
    # Husky A200 geometry, from clearpath_platform_description's a200.urdf.xacro:
    #   track  0.555  (wheel separation)
    #   wheel_radius 0.1651, wheelbase 0.512
    wheel_separation: 0.555
    wheels_per_side: 2
    wheel_radius: 0.1651
# Skid-steer scrub correction: a 4-wheel skid-steer rotates less than the
# 2-wheel diff-drive odom model predicts, so the effective track is inflated
# to make odom yaw match reality. Measured on the old chassis; recalibrate for
# the A200 by rotating in place and comparing odom yaw against ground truth.
    wheel_separation_multiplier: 1.46
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]
    open_loop: false
# The robot_localization EKF publishes odom->base_link, so the controller must
# not also publish that TF.
    enable_odom_tf: false
    cmd_vel_timeout: 0.5
    use_stamped_vel: false
# The hardware ceiling for the whole stack. The three limiters stay ordered --
# MPPI 0.90/2.2 asks, the velocity smoother 0.90/2.4 passes on, this 1.00/2.5
# executes -- so no layer silently clips a command the layer above planned.
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.0
        has_acceleration_limits: true
        max_acceleration: 2.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.5
        has_acceleration_limits: true
        max_acceleration: 6.0
